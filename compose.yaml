services:
  app:
    build:
      context: .
      target: base
      args:
        GIT_REVISION: ${PM_GIT_REVISION:?Set the exact git commit}
    image: pm-nautilus:${PM_GIT_REVISION}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    init: true
    stop_grace_period: 45s
    ports:
      - "127.0.0.1:${PM_PORT:-8765}:8765"
    environment:
      PM_UI_PASSWORD: ${PM_UI_PASSWORD:?Set a UI password of at least 16 characters}
      PM_ALLOWED_HOSTS: ${PM_ALLOWED_HOSTS:-localhost,127.0.0.1}
      PM_LIVE_ENABLED: "false"
      PM_TRUST_HTTPS_PROXY: ${PM_TRUST_HTTPS_PROXY:-false}
      PM_DATA_DIR: /data
      PM_TEST_ACTIVE_ACCOUNT: ${PM_TEST_ACTIVE_ACCOUNT:-}
      # Full market discovery every 15 min; candidates (no position) evaluated
      # in 1 s batches. Positions are processed on every quote regardless.
      PM_DISCOVERY_SECONDS: ${PM_DISCOVERY_SECONDS:-900}
      PM_CANDIDATE_BATCH_SECONDS: ${PM_CANDIDATE_BATCH_SECONDS:-1}
      PM_TEST_CAPTURE_ENABLED: ${PM_TEST_CAPTURE_ENABLED:-true}
      PM_TEST_CAPTURE_DIR: /recordings/segments
      PM_TEST_CAPTURE_MAX_GIB: ${PM_TEST_CAPTURE_MAX_GIB:-4}
      PM_TEST_CAPTURE_RESERVE_GIB: ${PM_TEST_CAPTURE_RESERVE_GIB:-12}
    volumes:
      - ./runtime/server:/data
      - test-recordings:/recordings
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  test-recordings:
